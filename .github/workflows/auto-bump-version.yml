name: Auto Increment Version

on:
  push:
    branches:
      - main
    # Prevent infinite loop by ignoring pushes that only contain package.json updates
    paths-ignore:
      - "package.json"

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    # Skip if the commit message contains '[skip ci]' or was generated by the bot
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Use GITHUB_TOKEN with write permission to push the version commit back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Version
        run: |
          # Bumps minor version (e.g., 1.0.211 -> 1.1.0) and commits.
          # To change this to patch bumping (1.0.211 -> 1.0.212), replace "minor" with "patch" below.
          npm version minor -m "chore(release): bump version to %s [skip ci]"

      - name: Push Changes
        run: |
          git push origin main
