name: Version Bump + Deploy

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "src/**"
      - "public/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      version-bumped: ${{ steps.bump.outputs.bumped }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"
          echo "### 📦 Current version: \`$VERSION\`" >> $GITHUB_STEP_SUMMARY

      - name: Bump version
        id: bump
        run: |
          # Skip bump if this push already changed package.json (i.e. previous bump commit)
          if git diff --name-only HEAD~1 | grep -q '^package.json$'; then
            echo "bumped=false" >> $GITHUB_OUTPUT
            echo "Skipping bump – this looks like a version commit"
          else
            npm version patch -m "🚀 Release v%s [skip ci]"
            echo "bumped=true" >> $GITHUB_OUTPUT
          fi

      - name: Push version bump
        if: steps.bump.outputs.bumped == 'true'
        run: git push origin main

  deploy:
    needs: bump-version
    if: |
      always() &&
      (needs.bump-version.outputs.version-bumped == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "### 🚀 Deploying version \`$VERSION\`" >> $GITHUB_STEP_SUMMARY

      - name: Cache node modules
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: node_modules
          key: vocab_node_modules_cache

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build
        run: npx vite build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
